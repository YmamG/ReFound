{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ReFound{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{% url 'core:home' %}">ReFound</a>
        <nav aria-label="Main navigation">
            <a href="{% url 'core:home' %}">Home</a>
            <a href="{% url 'core:browse' %}">Browse reports</a>
            <a href="{% url 'core:submit' 'lost' %}">Report lost</a>
            <a href="{% url 'core:submit' 'found' %}">Report found</a>
            <a href="{% url 'core:about' %}">About</a>
            <a href="{% url 'core:contact' %}">Contact</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
        <p>ReFound — helping belongings find their way home.</p>
    </footer>
    <script src="{% static 'js/main.js' %}" defer></script>
</body>
</html>
