{% load i18n %}{% if form.errors %}<div class="error-summary" role="alert" tabindex="-1"><h2>{% translate 'Please check the details below' %}</h2>{% for error in form.non_field_errors %}<p>{{ error }}</p>{% endfor %}<ul>{% for field in form %}{% for error in field.errors %}<li><a href="#{{ field.id_for_label }}">{{ field.label }}: {{ error }}</a></li>{% endfor %}{% endfor %}</ul></div>{% endif %}
